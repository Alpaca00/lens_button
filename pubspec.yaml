name: lens_button
description: "Lens Button"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/Inter/Inter-Medium.ttf
          weight: 500
    - family: Doto
      fonts:
        - asset: assets/Doto/doto_font.ttf
          weight: 500
  assets:
    - assets/Inter/
    - assets/Doto/